<div class="app-card">
  <div class="app-card-header">
    <h2>Administración de Restaurantes</h2>
  </div>

  <form (ngSubmit)="saveRestaurant()">
    <div class="form-grid">
      <div class="form-group">
        <label>Nombre:</label>
        <input type="hidden" [(ngModel)]="current.id" name="id" />
        <input type="text" [(ngModel)]="current.nombre" name="nombre" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit">
        {{ current.id ? "Actualizar" : "Agregar" }}
      </button>
      <button type="button" (click)="clear()">Limpiar</button>
    </div>
  </form>

  <div class="table-wrapper" *ngIf="restaurants.length">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of restaurants">
          <td>{{ r.id }}</td>
          <td>{{ r.nombre }}</td>
          <td>
            <button (click)="edit(r)">Editar</button>
            <button class="danger" (click)="delete(r.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <p class="empty-state" *ngIf="!restaurants.length">
    No hay restaurantes cargados.
  </p>
</div>
