<div class="app-card">
  <div class="app-card-header">
    <h2>Administración de Zonas</h2>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>Restaurante</label>
      <select [(ngModel)]="selectedRestaurantId" (change)="onRestaurantChange()">
        <option [ngValue]="null">-- Seleccione --</option>
        <option *ngFor="let r of restaurants" [ngValue]="r.id">
          {{ r.nombre }}
        </option>
      </select>
    </div>
  </div>

  <form *ngIf="selectedRestaurantId" (ngSubmit)="saveZone()">
    <div class="form-grid">
      <div class="form-group">
        <label>Nombre de la Zona</label>
        <input type="hidden" [(ngModel)]="current.id" name="id" />
        <input type="text" [(ngModel)]="current.nombre" name="nombre" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit">
        {{ current.id ? "Actualizar" : "Agregar" }}
      </button>
      <button type="button" (click)="clearZone()">Limpiar</button>
    </div>
  </form>

  <div class="table-wrapper" *ngIf="zones.length">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Zona</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let z of zones">
          <td>{{ z.id }}</td>
          <td>{{ z.nombre }}</td>
          <td>
            <button (click)="edit(z)">Editar</button>
            <button class="danger" (click)="delete(z.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <p class="empty-state" *ngIf="selectedRestaurantId && !zones.length">
    No hay zonas registradas.
  </p>
</div>
