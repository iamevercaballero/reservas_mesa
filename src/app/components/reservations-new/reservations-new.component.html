<div class="app-card">
  <div class="app-card-header">
    <h2>Nueva Reserva</h2>
    <span class="badge">Mesa automática</span>
  </div>

  <form (ngSubmit)="confirmarReserva()">
    <div class="section-title">
      <h3>Detalles de la reserva</h3>
    </div>

    <div class="form-grid">
      <!-- Restaurante -->
      <div class="form-group">
        <label>Restaurante</label>
        <select
          [(ngModel)]="selectedRestaurantId"
          name="restaurante"
          (change)="onRestaurantChange()">
          <option [ngValue]="null">-- Seleccione un restaurante --</option>
          <option *ngFor="let r of restaurants" [ngValue]="r.id">
            {{ r.nombre }}
          </option>
        </select>
      </div>

      <!-- Zona -->
      <div class="form-group" *ngIf="zones.length">
        <label>Zona</label>
        <select
          [(ngModel)]="selectedZoneId"
          name="zona"
          (change)="onZoneChange()">
          <option [ngValue]="null">-- Seleccione una zona --</option>
          <option *ngFor="let z of zones" [ngValue]="z.id">
            {{ z.nombre }}
          </option>
        </select>
      </div>

      <!-- Fecha -->
      <div class="form-group">
        <label>Fecha</label>
        <input
          type="date"
          [(ngModel)]="fecha"
          name="fecha" />
      </div>

      <!-- Hora -->
      <div class="form-group" *ngIf="horariosZona.length">
        <label>Hora</label>
        <select
          [(ngModel)]="hora"
          name="hora">
          <option value="">-- Seleccione un horario --</option>
          <option *ngFor="let h of horariosZona" [value]="h">
            {{ h }}
          </option>
        </select>
      </div>

      <!-- Cantidad de personas -->
      <div class="form-group">
        <label>Cantidad de personas</label>
        <input
          type="number"
          [(ngModel)]="cantidadPersonas"
          name="cantidadPersonas"
          min="1" />
      </div>
    </div>

    <!-- Datos del cliente-->
    <div class="section-title" style="margin-top: 10px;">
      <h3>Datos del Cliente</h3>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          placeholder="Nombre" />
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <input
          type="text"
          [(ngModel)]="apellido"
          name="apellido"
          placeholder="Apellido" />
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input
          type="text"
          [(ngModel)]="telefono"
          name="telefono"
          placeholder="+595..." />
      </div>
    </div>

    <!-- Botones -->
    <div class="form-actions">
      <button type="submit">
        Confirmar reserva
      </button>
      <button type="button" (click)="limpiar()">
        Limpiar
      </button>
    </div>

    <p class="text-muted" style="margin-top: 8px;">
      La mesa se mantiene reservada 15 minutos después del horario seleccionado.
    </p>
  </form>
</div>
